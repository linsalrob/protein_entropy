[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "protein_entropy"
version = "0.1.0"
description = "Encode proteins using transformers and calculate their entropy"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [
    {name = "Rob Edwards", email = "raedwards@gmail.com"}
]
keywords = ["protein", "entropy", "3Di", "ProstT5", "bioinformatics"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]

dependencies = [
    "transformers>=4.35.0",
    "sentencepiece>=0.1.99",
    "biopython>=1.80",
    "numpy>=1.24.0",
    "scipy>=1.11.0",
    "huggingface-hub>=0.19.0",
]

[project.optional-dependencies]
torch = [
    "torch>=2.0.0",
]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "pytest-mock>=3.12.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
    "mypy>=1.7.0",
]
docs = [
    "sphinx>=7.0.0",
    "sphinx-rtd-theme>=2.0.0",
    "myst-parser>=2.0.0",
]

[project.scripts]
protein_entropy = "protein_entropy.cli:main"

[project.urls]
Homepage = "https://github.com/linsalrob/protein_entropy"
Documentation = "https://protein-entropy.readthedocs.io"
Repository = "https://github.com/linsalrob/protein_entropy"
Issues = "https://github.com/linsalrob/protein_entropy/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
protein_entropy = ["data/*.fasta", "data/*.tsv"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
markers = [
    "integration: marks tests as integration tests (deselect with '-m \"not integration\"')",
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
]

[tool.black]
line-length = 100
target-version = ['py312']

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]
ignore = ["E501"]  # Ignore line too long for now

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
